name: Run Tests
run-name: "Run Tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  run_tests_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - name: Run tests against v0.11.7
        run: |
          alias podman=docker
          env NVIM_VERSION=v0.11.7
          /bin/bash test/test_in_container.sh
      - name: Run tests against v0.12.0
        run: |
          alias podman=docker
          env NVIM_VERSION=v0.12.0
          /bin/bash test/test_in_container.sh

  run_tests_windows:
    if: false   # racecar: non-Linux runner, not measured here
    runs-on: windows-latest
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
    - name: Install Neovim
      run: |
        choco install neovim
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
        refreshenv
    - name: Run tests
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
        powershell -File test\test.ps1
        exit $LASTEXITCODE
